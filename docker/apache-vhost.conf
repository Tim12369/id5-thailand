<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # The editors' WordPress, in the same container, at /wp
    # (docs/free-hosting.md). Everything else is the public website.
    Alias /wp /var/www/wordpress

    <Directory /var/www/wordpress>
        AllowOverride All
        Require all granted

        # A remote-publishing interface nothing here uses, and a favourite
        # target for password guessing.
        <Files "xmlrpc.php">
            Require all denied
        </Files>
    </Directory>

    # Nothing uploaded may ever run as a program.
    <Directory /var/www/wordpress/wp-content/uploads>
        <FilesMatch "\.(php\d?|phtml|phar|pl|py|cgi)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# A small instance (512 MB) serving two applications: a handful of PHP workers
# is what it can hold.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        8
    MaxConnectionsPerChild 300
</IfModule>
