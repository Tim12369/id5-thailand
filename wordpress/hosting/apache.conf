# A small instance (512 MB): a handful of PHP workers is all it can hold, and
# all an editing site needs.
ServerName localhost

<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          3
    MaxRequestWorkers        6
    MaxConnectionsPerChild 300
</IfModule>

# Nothing uploaded may ever run as a program.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(php|phtml|phar|pl|py|cgi)$">
        Require all denied
    </FilesMatch>
</Directory>
