services:
  - type: web
    name: id5-thailand
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "ID5 @ Thailand 5.0"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      # The free plan's disk is wiped on every restart, so pictures copied from
      # WordPress are also kept in the database and restored at start-up.
      - key: CMS_MEDIA_PERSIST
        value: "true"
      # Set these in the Render dashboard (Environment tab), not here:
      # APP_KEY, APP_URL, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD,
      # LINE_CHANNEL_ID, LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN,
      # GOOGLE_MAPS_API_KEY, GROQ_API_KEY
      # and, to connect the WordPress service below (docs/free-hosting.md):
      # CMS_ENABLED, CMS_WORDPRESS_URL, CMS_WORDPRESS_USER,
      # CMS_WORDPRESS_APP_PASSWORD, CMS_WEBHOOK_SECRET

  # The editors' WordPress (docs/free-hosting.md). Its content, and its
  # uploaded files, live in an external MySQL database: this plan has no
  # lasting disk.
  - type: web
    name: id5-cms
    runtime: docker
    plan: free
    dockerfilePath: ./wordpress/Dockerfile
    dockerContext: ./wordpress
    envVars:
      - key: WORDPRESS_DB_NAME
        value: defaultdb
      - key: ID5_PUBLIC_SITE_URL
        value: https://id5-thailand.onrender.com
      # Set these in the Render dashboard (Environment tab), not here:
      # WORDPRESS_DB_HOST (host:port), WORDPRESS_DB_USER, WORDPRESS_DB_PASSWORD,
      # ID5_WP_SECRET, ID5_WEBHOOK_SECRET
